<main class="mx-auto max-w-7xl px-6 py-12">
  <div *ngIf="errorMessage" class="mb-6 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
    {{ errorMessage }}
  </div>
  <div *ngIf="successMessage" class="mb-6 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700">
    {{ successMessage }}
  </div>

  <header class="mb-10 flex items-center justify-between">
    <h2 class="text-3xl font-bold tracking-tight text-slate-900">My Adventures</h2>
    <button
      type="button"
      class="rounded-2xl bg-brand-500 px-6 py-3 font-bold text-white shadow-md transition-all duration-300 hover:bg-brand-600"
      (click)="openEditTripModal()"
    >
      + Plan New Trip
    </button>
  </header>

  <div class="grid grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-3">
    <ng-container *ngIf="trips.length > 0; else noTrips">
      <div *ngFor="let trip of trips">
        <div class="rounded-3xl border border-slate-100 bg-white/90 p-6 shadow-soft transition-all duration-300 hover:-translate-y-1 hover:shadow-elevated">
          <div class="mb-4 flex items-start justify-between gap-4">
            <div>
              <h3 class="text-xl font-black text-slate-900">{{ trip.title }}</h3>
              <p class="mt-2 text-sm font-medium text-slate-500">
                {{ trip.startDate | date:'mediumDate' }} - {{ trip.endDate | date:'mediumDate' }}
              </p>
            </div>
            <button
              type="button"
              class="rounded-2xl bg-slate-100 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-slate-600 transition-all duration-300 hover:bg-slate-200"
              (click)="deleteTrip(trip.id)"
            >
              Delete
            </button>
          </div>
          <p class="text-sm text-slate-500 line-clamp-3">{{ trip.description || 'No description yet.' }}</p>
          <a
            class="mt-4 inline-flex items-center gap-2 text-sm font-bold text-brand-500 transition-all duration-300 hover:text-brand-600"
            [routerLink]="['/trip', trip.id]"
          >
            View details
            <span aria-hidden="true">→</span>
          </a>
        </div>
      </div>
    </ng-container>
  </div>

  <ng-template #noTrips>
    <div class="flex min-h-[220px] flex-col items-center justify-center rounded-3xl border-2 border-dashed border-slate-200 bg-slate-50 text-center">
      <div class="mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-white text-2xl text-brand-500 shadow-soft">+</div>
      <p class="text-lg font-semibold text-slate-700">No trips yet</p>
      <p class="mt-1 text-sm text-slate-500">Create your first adventure to get started.</p>
    </div>
  </ng-template>
</main>

<div *ngIf="isTripModalOpen" class="fixed inset-0 z-50 flex items-center justify-center px-4 py-10">
  <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" (click)="closeEditTripModal()"></div>
  <div class="relative z-10 w-full max-w-lg rounded-4xl border border-white/20 bg-white/95 p-6 shadow-elevated backdrop-blur-xl">
    <div class="mb-6 flex items-center justify-between">
      <h3 class="text-xl font-black uppercase tracking-tight text-slate-900">Plan New Trip</h3>
      <button
        type="button"
        class="rounded-full p-2 text-slate-500 transition-all duration-300 hover:bg-slate-100"
        (click)="closeEditTripModal()"
      >
        <span class="text-xl">&times;</span>
      </button>
    </div>
    <edit-trip-modal (onEditTrip)="onTripCreated($event)"></edit-trip-modal>
  </div>
</div>

<confirm-dialog
  [isOpen]="isDeleteConfirmOpen"
  title="Delete trip?"
  message="This will permanently remove the trip and all its data."
  confirmText="Delete trip"
  cancelText="Cancel"
  (onConfirm)="confirmDeleteTrip()"
  (onCancel)="cancelDeleteTrip()"
></confirm-dialog>
