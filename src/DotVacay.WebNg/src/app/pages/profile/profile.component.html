<div class="mx-auto mt-12 max-w-3xl px-6">
  <div *ngIf="errorMessage" class="mb-6 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
    {{ errorMessage }}
  </div>
  <div *ngIf="successMessage" class="mb-6 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700">
    {{ successMessage }}
  </div>

  <div class="rounded-4xl border border-slate-100 bg-white p-8 shadow-soft">
    <h3 class="text-2xl font-black text-slate-900">My Profile</h3>
    <div class="mt-8 flex flex-col items-center text-center">
      <div class="h-24 w-24 overflow-hidden rounded-full bg-slate-100">
        <img [src]="getGravatarUrl(profile.email)"
             alt="User Avatar"
             class="h-full w-full object-cover"
             referrerpolicy="no-referrer">
      </div>
      <h4 class="mt-4 text-xl font-bold text-slate-900">{{ profile.firstName }} {{ profile.lastName }}</h4>
      <p class="text-sm font-medium text-slate-500">{{ profile.email }}</p>
    </div>
  </div>
</div>
