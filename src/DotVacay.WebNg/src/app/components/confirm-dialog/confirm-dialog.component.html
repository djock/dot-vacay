<div *ngIf="isOpen" class="fixed inset-0 z-[120] flex items-center justify-center px-4 py-10">
  <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" (click)="cancel()"></div>
  <div class="relative z-10 w-full max-w-md rounded-3xl border border-white/20 bg-white p-6 shadow-elevated">
    <h3 class="text-lg font-black text-slate-900">{{ title }}</h3>
    <p class="mt-2 text-sm text-slate-500">{{ message }}</p>
    <div class="mt-6 flex justify-end gap-3">
      <button
        type="button"
        class="rounded-2xl bg-slate-100 px-4 py-2 text-sm font-semibold text-slate-700 transition-all duration-300 hover:bg-slate-200"
        (click)="cancel()"
      >
        {{ cancelText }}
      </button>
      <button
        type="button"
        class="rounded-2xl px-4 py-2 text-sm font-semibold text-white transition-all duration-300"
        [ngClass]="isDanger ? 'bg-rose-500 hover:bg-rose-600' : 'bg-brand-500 hover:bg-brand-600'"
        (click)="confirm()"
      >
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
