<form (ngSubmit)="onSubmit()" class="space-y-6">
  <div class="space-y-2">
    <label for="locationInput" class="text-xs font-black uppercase text-slate-400">Location</label>
    <div class="relative">
      <input
        type="text"
        id="locationInput"
        [(ngModel)]="tripModel.title"
        name="title"
        class="w-full rounded-2xl border border-slate-200 bg-slate-50 p-4 font-medium text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 focus:ring-offset-white"
        placeholder="Search for a location..."
        autocomplete="off"
        (input)="onLocationInput($event)"
        required
      />
      <div
        id="locationDropdown"
        class="absolute z-10 mt-2 w-full rounded-2xl border border-slate-100 bg-white shadow-soft"
        [class.hidden]="!showDropdown"
      >
        <div *ngIf="isLoading" class="p-3 text-sm text-slate-500">Loading...</div>
        <div *ngIf="!isLoading && locations.length === 0 && searchQuery.length >= 2" class="p-3 text-sm text-slate-500">
          No locations found
        </div>
        <div *ngIf="!isLoading && locations.length > 0" class="max-h-56 overflow-y-auto">
          <div
            *ngFor="let location of locations"
            class="cursor-pointer px-4 py-3 transition-all duration-300 hover:bg-slate-50"
            (click)="selectLocation(location)"
          >
            <div class="text-sm font-semibold text-slate-700">{{location.display_name.split(',')[0]}}</div>
            <div class="text-xs text-slate-400">{{location.display_name.split(',').slice(1, 3).join(',')}}</div>
          </div>
        </div>
      </div>
    </div>
    <div *ngIf="validationErrors.title" class="text-sm text-red-600">{{validationErrors.title}}</div>
  </div>

  <div class="space-y-2">
    <label for="description" class="text-xs font-black uppercase text-slate-400">Description</label>
    <textarea
      id="description"
      [(ngModel)]="tripModel.description"
      name="description"
      class="w-full rounded-2xl border border-slate-200 bg-slate-50 p-4 font-medium text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 focus:ring-offset-white"
      placeholder="Description"
      rows="3"></textarea>
  </div>

  <div class="grid gap-4 md:grid-cols-2">
    <div class="space-y-2">
      <label for="startDate" class="text-xs font-black uppercase text-slate-400">Start Date</label>
      <input
        type="date"
        id="startDate"
        class="w-full rounded-2xl border border-slate-200 bg-slate-50 p-4 font-medium text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 focus:ring-offset-white"
        [min]="minDate | date:'yyyy-MM-dd'"
        [(ngModel)]="tripModel.startDate"
        (change)="onStartDateChange($event)"
        name="startDate"
        required
      >
      <div *ngIf="validationErrors.startDate" class="text-sm text-red-600">{{validationErrors.startDate}}</div>
    </div>

    <div class="space-y-2">
      <label for="endDate" class="text-xs font-black uppercase text-slate-400">End Date</label>
      <input
        type="date"
        id="endDate"
        class="w-full rounded-2xl border border-slate-200 bg-slate-50 p-4 font-medium text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 focus:ring-offset-white"
        [min]="tripModel.startDate || (minDate | date:'yyyy-MM-dd')"
        [(ngModel)]="tripModel.endDate"
        name="endDate"
        required
      >
      <div *ngIf="validationErrors.endDate" class="text-sm text-red-600">{{validationErrors.endDate}}</div>
    </div>
  </div>

  <input type="hidden" [(ngModel)]="tripModel.latitude" name="latitude" />
  <input type="hidden" [(ngModel)]="tripModel.longitude" name="longitude" />

  <div *ngIf="validationErrors.general" class="rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
    {{validationErrors.general}}
  </div>

  <div class="text-right">
    <button
      type="submit"
      class="rounded-2xl bg-brand-500 px-6 py-3 text-sm font-bold text-white shadow-md transition-all duration-300 hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-60"
      [disabled]="isSubmitting"
    >
      {{isSubmitting ? 'Creating...' : 'Create Trip'}}
    </button>
  </div>
</form>
