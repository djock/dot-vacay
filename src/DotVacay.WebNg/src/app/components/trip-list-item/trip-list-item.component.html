<div class="trip-list-item flex items-center gap-3 p-3 bg-slate-50 rounded-xl hover:bg-slate-100 transition-colors group">
  <label class="flex items-center gap-3 cursor-pointer flex-1">
    <input 
      type="checkbox" 
      [checked]="tripListItem.isChecked"
      (change)="toggleCheck()"
      class="w-5 h-5 rounded border-2 border-slate-300 text-blue-500 focus:ring-blue-500 focus:ring-offset-0 cursor-pointer"
    />
    <span 
      class="flex-1 text-slate-700 font-medium transition-all duration-200"
      [class.line-through]="tripListItem.isChecked"
      [class.text-slate-400]="tripListItem.isChecked"
    >
      {{ tripListItem.title }}
    </span>
  </label>
  
  <button 
    type="button" 
    (click)="deleteItem()"
    class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 transition-all duration-200 p-2 rounded-lg hover:bg-red-50"
    title="Delete item"
  >
    <i class="bi bi-x-lg"></i>
  </button>
</div>

<confirm-dialog
  [isOpen]="isDeleteConfirmOpen"
  title="Delete list item?"
  message="This will permanently remove this item."
  confirmText="Delete"
  cancelText="Cancel"
  (onConfirm)="confirmDeleteItem()"
  (onCancel)="cancelDeleteItem()"
></confirm-dialog>
