<a [routerLink]="['/trip', trip.id]" class="group relative block aspect-[4/5] overflow-hidden rounded-3xl bg-slate-100 shadow-soft transition-all duration-300 hover:shadow-elevated">
  <img
    src="https://picsum.photos/seed/{{trip.id}}/800/1000"
    class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-110"
    alt="{{trip.title}}"
  />
  <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
  <div *ngIf="trip.isOwner" class="absolute right-4 top-4">
    <button
      type="button"
      class="h-11 rounded-full bg-white/90 px-4 text-xs font-semibold text-slate-700 shadow-md transition-all duration-300 hover:bg-white sm:h-auto sm:px-3 sm:py-1"
      (click)="deleteTrip(); $event.stopPropagation();"
    >
      Delete
    </button>
  </div>
  <div class="absolute bottom-0 p-8 text-white">
    <p class="text-xs font-bold uppercase tracking-widest opacity-70">
      {{trip.startDate | date:'mediumDate'}} - {{trip.endDate | date:'mediumDate'}}
    </p>
    <h3 class="mt-2 text-3xl font-bold">{{trip.title}}</h3>
    <p class="mt-2 text-sm text-white/80">{{trip.description}}</p>
  </div>
</a>
