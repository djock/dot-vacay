services:
  backend:
    build:
      context: ./src
      dockerfile: DotVacay.API/Dockerfile
    container_name: dotvacay-backend
    ports:
      - "5111:5111"
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - dotvacay_db:/app/data
    environment:
      - DOTVACAY_JWT__KEY=${DOTVACAY_JWT__KEY}
      - DOTVACAY_JWT__ISSUER=${DOTVACAY_JWT__ISSUER}
      - DOTVACAY_JWT__AUDIENCE=${DOTVACAY_JWT__AUDIENCE}
      - DOTVACAY_JWT__EXPIREDAYS=${DOTVACAY_JWT__EXPIREDAYS:-30}
      - DOTVACAY_CORS__ALLOWEDORIGINS=${DOTVACAY_CORS__ALLOWEDORIGINS}
      - DOTVACAY_CONNECTIONSTRINGS__DEFAULTCONNECTION=${DOTVACAY_CONNECTIONSTRINGS__DEFAULTCONNECTION:-Data Source=/app/data/dotvacay.db}
      - DOTVACAY_DB_PATH=${DOTVACAY_DB_PATH:-/app/data/dotvacay.db}
      - DOTVACAY_OPENAI_APIKEY=${DOTVACAY_OPENAI_APIKEY:-}
    networks:
      - dotvacay-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5111/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./src/DotVacay.WebReact
      dockerfile: Dockerfile.dev
    container_name: dotvacay-frontend
    ports:
      - "50316:50316"
    volumes:
      - ./src/DotVacay.WebReact:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://192.168.1.187:5111/api
    depends_on:
      - backend
    networks:
      - dotvacay-network

networks:
  dotvacay-network:
    driver: bridge

volumes:
  dotvacay_db:
    driver: local
